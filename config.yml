# Start in diagnostic mode. Change to "sync" only after field mapping is verified.
mode: diagnostic
timezone: Asia/Shanghai

feishu:
  app_id: ${FEISHU_APP_ID}
  app_secret: ${FEISHU_APP_SECRET}

source:
  wiki_url: https://lcnjnx6udyw7.feishu.cn/wiki/Ka4pw0Asvif29vkfTLschR9Kn4g?table=tblNs0VHLchZs3wf&view=vewyMzx1jM
  table_id: tblNs0VHLchZs3wf # US-META 26 Ad Daily Raw
  fields:
    date: ""
    ad_id: ""
    spend: ""
    impressions: ""
    reach: ""
    clicks: ""
    purchases: ""
    purchase_value: ""

destination:
  wiki_url: https://m5cbccobcv.feishu.cn/wiki/Ac12wkkv1iaz2sk3XzYcqMnRnef?table=tblv7jvWOYGVeOTK&view=vewEOx5FxC
  table_id: tblv7jvWOYGVeOTK # META内容中台源表
  fields:
    ad_id: ""
    status: ""
    lifecycle: ""
    cumulative_performance: ""
    last_synced_date: "" # Optional; leave blank to omit.
  active_status: 投放中
  stopped_status: 已停投

# An empty state is initialized from the Raw table: recent two days both zero -> 已停投;
# otherwise -> 投放中. 已停投 is a terminal value for this program and is never reversed.
rules:
  stopped_after_zero_spend_days: 2
  allow_empty_status_initialization: true
