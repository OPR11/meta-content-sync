name: Meta content sync

on:
  workflow_dispatch:
  schedule:
    # UTC schedule: 05:00, 10:00, 15:00, 20:00 Asia/Shanghai (UTC+8)
    - cron: "0 21,2,7,12 * * *"

permissions:
  contents: write

concurrency:
  group: meta-content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Diagnose or sync the previous report day
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_SOURCE_APP_TOKEN: ${{ secrets.FEISHU_SOURCE_APP_TOKEN }}
          FEISHU_DESTINATION_APP_TOKEN: ${{ secrets.FEISHU_DESTINATION_APP_TOKEN }}
        run: python src/meta_content_sync.py --config config/config.yml
      - name: Save successful-sync state
        run: |
          if git diff --quiet -- state/sync_state.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/sync_state.json
          git commit -m "chore: record successful report-date sync"
          git push
